<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WarKoWar</title>

<!--FONT-->
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

  <!-- ICON -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- HOME -->
  <section class="hero" id="home">

    <!-- NAVBAR -->
    <nav class="navbar">
      <h1 class="logo">
        <span class="k1">War</span>
          <div class="sub-logo">
            <span class="k2">Ko</span>
            <span class="k3">WAR</span>
          </div>
      </h1>
      
      <ul>
        <li><a href="#home">Beranda</a></li>

        <!-- pindah ke halaman menu -->
        <li><a href="menu.html">Menu</a></li>

        <!-- langsung ke google maps -->
        <li>
          <a href="https://maps.app.goo.gl/8xpY4S37vdeN1PRk8"
             target="_blank">
             Lokasi
          </a>
        </li>

        <!-- langsung ke whatsapp -->
        <li>
          <a href="https://wa.me/6285714151617"
             target="_blank">
             Pesan
          </a>
        </li>
      </ul>
    </nav>

    <!-- KONTEN -->
    <div class="hero-content">
      <p>Bukan Sekedar Nongki,</p>

      <h2>
        Tapi Cari <br>
        Inspirasi
      </h2>

      <span>Dengan Secangkir Kopi</span>
    </div>

  </section>
       
  <script>
    // NAVBAR SCROLL EFFECT
window.addEventListener("scroll", function () {
  const navbar = document.querySelector(".navbar");

  if (navbar) {
    navbar.classList.toggle("active", window.scrollY > 50);
  }
});

// SMOOTH SCROLL
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
  anchor.addEventListener("click", function (e) {

    const target = document.querySelector(this.getAttribute("href"));

    if (target) {
      e.preventDefault();

      target.scrollIntoView({
        behavior: "smooth"
      });
    }
  });
});

// ANIMASI HERO CONTENT
window.addEventListener("load", () => {
  const hero = document.querySelector(".hero-content");

  if (hero) {
    hero.style.opacity = "1";
    hero.style.transform = "translateY(0)";
  }
});

// ALERT WHATSAPP
const pesanBtn = document.querySelector('a[href*="https://wa.me/6285714109246"]');

if (pesanBtn) {
  pesanBtn.addEventListener("click", () => {
    alert("Kamu akan diarahkan ke WhatsApp untuk memesan ☕");
  });
}

// ALERT GOOGLE MAPS
const LokasiBttn = document.querySelector('a[href*="https://maps.app.goo.gl/8xpY4S37vdeN1PRk8"]');

if (LokasiBttn) {
  LokasiBttn.addEventListener("click", () => {
    alert("Kamu akan diarahkan ke Google Maps untuk melihat lokasi kami 📍");
  });
}
  </script>
  
</body>
</html>
